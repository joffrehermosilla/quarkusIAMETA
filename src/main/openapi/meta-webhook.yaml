openapi: 3.0.3

info:
  title: Meta WhatsApp Webhook API
  version: 2.0.0
  description: |
    Meta WhatsApp Business Webhook
    Adobe Experience Platform
    Adobe Journey Optimizer
    Bidirectional Integration

paths:

  /webhook:

    get:

      tags:
        - Meta

      summary: Verify Meta Handshake

      operationId: verifyHandshake

      parameters:

        - name: hub.mode
          in: query
          required: true
          schema:
            type: string

        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string

        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string

      responses:

        "200":
          description: Handshake OK
          content:
            text/plain:
              schema:
                type: string

        "403":
          description: Invalid Token

    post:

      tags:
        - Meta

      summary: Receive WhatsApp events

      operationId: handleEvent

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: '#/components/schemas/MetaEvent'

      responses:

        "200":
          description: Processed

          content:

            application/json:

              schema:

                type: object

                properties:

                  message:

                    type: string

  /adobe/webhook:

    post:

      tags:
        - Adobe

      summary: Receive callback from Adobe Journey Optimizer

      operationId: handleAdobeWebhook

      requestBody:

        required: true

        content:

          application/json:

            schema:

              type: object

      responses:

        "200":

          description: Adobe callback processed

components:

  schemas:

    MetaEvent:

      type: object

      properties:

        object:

          type: string

        entry:

          type: array

          items:

            $ref: '#/components/schemas/Entry'

    Entry:

      type: object

      properties:

        id:

          type: string

        changes:

          type: array

          items:

            $ref: '#/components/schemas/Change'

    Change:

      type: object

      properties:

        field:

          type: string

        value:

          $ref: '#/components/schemas/Value'

    Value:

      type: object

      properties:

        messaging_product:

          type: string

        contacts:

          type: array

          items:

            $ref: '#/components/schemas/Contact'

        messages:

          type: array

          items:

            $ref: '#/components/schemas/Message'

        statuses:

          type: array

          items:

            $ref: '#/components/schemas/Status'

    Contact:

      type: object

      properties:

        wa_id:

          type: string

        profile:

          $ref: '#/components/schemas/Profile'

    Profile:

      type: object

      properties:

        name:

          type: string

    Message:

      type: object

      properties:

        id:

          type: string

        from:

          type: string

        timestamp:

          type: string

        type:

          type: string

        context:

          $ref: '#/components/schemas/Context'

        text:

          $ref: '#/components/schemas/Text'

        button:

          $ref: '#/components/schemas/Button'

        image:

          $ref: '#/components/schemas/Image'

        audio:

          $ref: '#/components/schemas/Audio'

        video:

          $ref: '#/components/schemas/Video'

        document:

          $ref: '#/components/schemas/Document'

    Context:

      type: object

      properties:

        id:

          type: string

    Text:

      type: object

      properties:

        body:

          type: string

    Button:

      type: object

      properties:

        text:

          type: string

        payload:

          type: string

    Image:

      type: object

      properties:

        id:

          type: string

        mime_type:

          type: string

        sha256:

          type: string

    Audio:

      type: object

      properties:

        id:

          type: string

        mime_type:

          type: string

        sha256:

          type: string

    Video:

      type: object

      properties:

        id:

          type: string

        mime_type:

          type: string

        sha256:

          type: string

    Document:

      type: object

      properties:

        id:

          type: string

        filename:

          type: string

        mime_type:

          type: string

        sha256:

          type: string

    Status:

      type: object

      properties:

        id:

          type: string

        status:

          type: string

        timestamp:

          type: string

        recipient_id:

          type: string

        conversation:

          $ref: '#/components/schemas/Conversation'

    Conversation:

      type: object

      properties:

        id:

          type: string

        origin:

          $ref: '#/components/schemas/Origin'

    Origin:

      type: object

      properties:

        type:

          type: string