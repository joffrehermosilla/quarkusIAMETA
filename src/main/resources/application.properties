############################################################
# HTTP
############################################################

quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.access-log.enabled=true

############################################################
# Logging
############################################################

quarkus.log.level=INFO
quarkus.log.category."com.adobe.ajo.webhook".level=DEBUG

quarkus.log.console.enable=true
quarkus.log.console.json=false

############################################################
# Health
############################################################

quarkus.smallrye-health.root-path=/health

############################################################
# Kubernetes
############################################################

quarkus.kubernetes.deployment-target=kubernetes
quarkus.kubernetes.namespace=ajo-namespace
quarkus.kubernetes.service-type=cluster-ip

############################################################
# Helm
############################################################

quarkus.helm.enabled=true
quarkus.helm.name=meta-webhook-app

############################################################
# Azure Key Vault
############################################################

quarkus.azure.keyvault.secret.enabled=true
quarkus.azure.keyvault.secret.endpoint=https://kv-meta-ajo-dev-001.vault.azure.net/
quarkus.azure.keyvault.config-ordinal=400

############################################################
# Adobe CDP
############################################################

quarkus.rest-client.cdp-client.url=${CDP_ENDPOINT_URL}

cdp.auth.token=${CDP_AUTH_TOKEN}

cdp.flow.id=${CDP_FLOW_ID}

############################################################
# Meta Webhook
############################################################

meta.verify.token=${META_VERIFY_TOKEN}

############################################################
# MongoDB Atlas
############################################################

quarkus.mongodb.connection-string=${MONGODB_URI}
quarkus.mongodb.database=ajo_meta_db

############################################################
# OpenAI
############################################################

ai.openai.key=${OPENAI_API_KEY}

############################################################
# DeepSeek
############################################################

ai.deepseek.key=${DEEPSEEK_API_KEY}

############################################################
# Groq
############################################################

ai.groq.key=${GROQ_API_KEY}

############################################################
# Moonshot
############################################################

ai.moonshot.key=${MOONSHOT_KEY}

############################################################
# MiniMax
############################################################

ai.minimax.key=${MINIMAX_API_KEY}

############################################################
# Gemini
############################################################

ai.google.key=${GOOGLE_AI_API_KEY}

gemini-api/mp-rest/url=https://generativelanguage.googleapis.com

############################################################
# Kubernetes ConfigMap
############################################################

quarkus.kubernetes.env.configmaps=meta-webhook-config

############################################################
# Azure Workload Identity (Helm)
############################################################

quarkus.kubernetes.labels."azure.workload.identity/use"=true
quarkus.kubernetes.service-account=meta-webhook-sa