quarkus.http.port=8080
quarkus.log.level=INFO
quarkus.log.category."com.adobe.ajo.webhook".level=DEBUG
quarkus.http.access-log.enabled=true

# Kubernetes & Helm Settings
quarkus.kubernetes.deployment-target=kubernetes
quarkus.kubernetes.namespace=ajo-namespace
quarkus.helm.enabled=true
quarkus.helm.name=meta-webhook-app

# Azure Key Vault Configuration
quarkus.azure.keyvault.enabled=true
quarkus.azure.keyvault.secret.endpoint=https://kv-meta-ajo-joffre.vault.azure.net/

# CDP & Meta Settings (Mapeados a Azure Key Vault)
quarkus.rest-client.cdp-client.url=${CDP_ENDPOINT_URL:https://api.adobe.io}
cdp.auth.token=${cdp-auth-token:dummy}
cdp.flow.id=${cdp-flow-id:dummy}
meta.verify.token=${meta-verify-token:changeit}

# MongoDB Atlas
quarkus.mongodb.connection-string=${mongodb-uri:mongodb://localhost:27017}
quarkus.mongodb.database=ajo_meta_db

# Multi-AI Configuration (Fallback order: OpenAI -> DeepSeek -> Groq -> Moonshot -> Gemini)
ai.openai.key=${openai-api-key:dummy}
ai.deepseek.key=${deepseek-api-key:dummy}
ai.groq.key=${groq-api-key:dummy}
ai.moonshot.key=${moonshot-key:dummy}
ai.minimax.key=${minimax-api-key:dummy}
ai.google.key=${google-ai-api-key:dummy}
gemini-api/mp-rest/url=https://generativelanguage.googleapis.com

