name: Build and Deploy to AKS

on:
  push:
    branches:
      - main

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
  AKS_CLUSTER: ${{ secrets.AKS_CLUSTER_NAME }}
  AKS_RG: ${{ secrets.RESOURCE_GROUP }}
  IMAGE_NAME: meta-whatsapp-webhook

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Quarkus
        run: mvn clean package -DskipTests

      - name: Docker Login
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -f src/main/docker/Dockerfile.jvm \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push \
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: AKS Login
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RG }}
          cluster-name: ${{ env.AKS_CLUSTER }}

      - name: Apply ConfigMap
        run: kubectl apply -f k8s/01-configmap.yaml

      - name: Remove empty env vars generated by Quarkus
        run: |
          DEPLOY=target/helm/kubernetes/meta-webhook-app/templates/deployment.yaml

          sed -i '/- name: OPENAI_API_KEY/{N;d;}' $DEPLOY
          sed -i '/- name: GOOGLE_AI_API_KEY/{N;d;}' $DEPLOY
          sed -i '/- name: GROQ_API_KEY/{N;d;}' $DEPLOY
          sed -i '/- name: DEEPSEEK_API_KEY/{N;d;}' $DEPLOY
          sed -i '/- name: MINIMAX_API_KEY/{N;d;}' $DEPLOY
          sed -i '/- name: MOONSHOT_KEY/{N;d;}' $DEPLOY
          sed -i '/- name: META_VERIFY_TOKEN/{N;d;}' $DEPLOY
          sed -i '/- name: MONGODB_URI/{N;d;}' $DEPLOY
          sed -i '/- name: CDP_AUTH_TOKEN/{N;d;}' $DEPLOY
          sed -i '/- name: CDP_ENDPOINT_URL/{N;d;}' $DEPLOY
          sed -i '/- name: CDP_FLOW_ID/{N;d;}' $DEPLOY

      - name: Deploy Helm
        run: |
          helm upgrade --install meta-webhook-app \
            ./target/helm/kubernetes/meta-webhook-app \
            --namespace ajo-namespace \
            --create-namespace \
            --set app.image=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/meta-whatsapp-webhook \
            -n ajo-namespace \
            --timeout=180s

      - name: Show Pods
        if: always()
        run: kubectl get pods -n ajo-namespace -o wide

      - name: Show Logs
        if: failure()
        run: |
          POD=$(kubectl get pod -n ajo-namespace \
            -l app.kubernetes.io/name=meta-whatsapp-webhook \
            -o jsonpath='{.items[0].metadata.name}')

          kubectl describe pod $POD -n ajo-namespace || true
          kubectl logs $POD -n ajo-namespace --previous || true