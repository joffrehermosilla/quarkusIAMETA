name: Build and Deploy to AKS

on:
  push:
    branches:
      - main

env:
  ACR_LOGIN_SERVER: acradobemetadev.azurecr.io
  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
  AKS_CLUSTER: aks-adobe-meta-dev
  AKS_RG: rg-adobe-meta-dev
  IMAGE_NAME: meta-whatsapp-webhook

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven (Quarkus JVM)
      run: mvn clean package -DskipTests

    - name: Docker Login to ACR
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.ACR_LOGIN_SERVER }}
        username: ${{ env.ACR_USERNAME }}
        password: ${{ env.ACR_PASSWORD }}

    - name: Build and Push Docker image
      run: |
        docker build -f src/main/docker/Dockerfile.jvm -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
        docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: 'v3.14.0'

    - name: Azure Kubernetes Login
      uses: azure/aks-set-context@v3
      with:
        resource-group: ${{ env.AKS_RG }}
        cluster-name: ${{ env.AKS_CLUSTER }}
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to AKS with Helm
      run: |
        helm upgrade --install meta-webhook-app ./target/helm/kubernetes/meta-webhook-app \
          --set app.image=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --namespace ajo-namespace --create-namespace
